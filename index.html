<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloader · OxClub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 1.5rem;
        }

        .card {
            background: rgba(18, 28, 46, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 2rem;
            padding: 2rem 2rem 2.2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.7),
                        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            transition: transform 0.2s ease;
        }

        .card:hover { transform: translateY(-2px); }

        h1 {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: #f0f4fe;
            margin-bottom: 0.4rem;
        }

        h1 span {
            background: #3b82f6;
            font-size: 1.4rem;
            line-height: 1;
            padding: 0.25rem 0.6rem;
            border-radius: 100px;
            font-weight: 500;
            color: #ffffff;
            box-shadow: 0 4px 10px -2px #1e3a8a;
        }

        .subhead {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            border-left: 3px solid #3b82f6;
            padding-left: 0.9rem;
            font-weight: 400;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.8rem;
        }

        .url-field {
            display: flex;
            align-items: center;
            background: #0b1220;
            border: 1px solid #2d3a4f;
            border-radius: 1.2rem;
            padding: 0.1rem 0.1rem 0.1rem 1.2rem;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .url-field:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .url-field input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.9rem 0.5rem 0.9rem 0;
            font-size: 1rem;
            color: #e2e8f0;
            outline: none;
            min-width: 0;
        }

        .url-field input::placeholder {
            color: #5b6b82;
            font-weight: 400;
            font-size: 0.95rem;
        }

        .url-field button {
            background: #1e2a3d;
            border: 1px solid #31445e;
            color: #a0b3d9;
            padding: 0.7rem 1.1rem;
            margin: 0.25rem;
            border-radius: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .url-field button:hover {
            background: #2a3a53;
            color: #d9e6ff;
            border-color: #4b658b;
        }

        .download-btn {
            background: linear-gradient(135deg, #2563eb, #1e4fcf);
            border: 1px solid #3b82f6;
            border-radius: 1.2rem;
            padding: 1rem 1.8rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 12px 18px -10px #1e3a8a,
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            letter-spacing: -0.01em;
            margin-bottom: 1.5rem;
            width: 100%;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 16px 22px -10px #1e3a8a,
                        0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            transform: scale(1.01);
        }

        .download-btn:active {
            transform: scale(0.99);
            box-shadow: 0 6px 10px -6px #0f172a;
        }

        .download-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            background: #334155;
            border-color: #475569;
        }

        .status-area {
            background: #0b1220;
            border-radius: 1rem;
            padding: 1rem 1.2rem;
            border: 1px solid #253141;
            min-height: 4.2rem;
            font-size: 0.95rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }

        .status-icon { font-size: 1.3rem; line-height: 1; }

        .status-text {
            flex: 1;
            word-break: break-word;
            font-weight: 450;
        }

        .status-text strong {
            color: #e2e8f0;
            font-weight: 600;
            background: #1e2a3d;
            padding: 0.1rem 0.4rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-left: 0.2rem;
        }

        .clear-history {
            background: transparent;
            border: 1px solid #334155;
            color: #8194b0;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .clear-history:hover {
            background: #1e2a3d;
            color: #b7c9e8;
            border-color: #476085;
        }

        .history-list {
            margin-top: 1.2rem;
            background: #0b1220;
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            border: 1px solid #1f2b3b;
            max-height: 170px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #2e405b #0b1220;
        }

        .history-list::-webkit-scrollbar { width: 5px; }
        .history-list::-webkit-scrollbar-track { background: #0b1220; border-radius: 20px; }
        .history-list::-webkit-scrollbar-thumb { background: #2e405b; border-radius: 20px; }

        .history-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #5f7492;
            font-weight: 600;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 0;
            border-bottom: 1px solid #1a2433;
            font-size: 0.85rem;
            color: #a9bbd6;
        }

        .history-item:last-child { border-bottom: none; }

        .history-item .hist-url {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            color: #8fa5c7;
        }

        .badge {
            background: #1e3a5f;
            color: #a5c8ff;
            font-size: 0.7rem;
            padding: 0.15rem 0.55rem;
            border-radius: 30px;
            font-weight: 500;
            border: 1px solid #2d4a72;
            white-space: nowrap;
        }

        .empty-history {
            color: #516077;
            font-style: italic;
            font-size: 0.85rem;
            text-align: center;
            padding: 0.5rem 0;
        }

        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        button:disabled { opacity: 0.55; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⬇️ Downloader <span>app</span></h1>
        <div class="subhead">paste any direct file link — grab it instantly</div>

        <div class="input-group">
            <div class="url-field">
                <input type="url" id="urlInput" placeholder="https://example.com/file.zip" autocomplete="off" spellcheck="false">
                <button id="pasteBtn" title="Paste from clipboard">📋 Paste</button>
            </div>
        </div>

        <button class="download-btn" id="downloadBtn">
            <span>⬇</span> Download file
        </button>

        <div class="status-area" id="statusArea">
            <span class="status-icon">💡</span>
            <span class="status-text" id="statusText">Ready — enter a URL and click download.</span>
        </div>

        <div class="flex-row">
            <div class="history-title">
                <span>🕒 recent downloads</span>
                <span id="historyCount" class="badge">0</span>
            </div>
            <button class="clear-history" id="clearHistoryBtn">
                <span>✕</span> Clear
            </button>
        </div>

        <div class="history-list" id="historyList">
            <div class="empty-history">no downloads yet</div>
        </div>
    </div>

    <script>
        (function() {
            const urlInput = document.getElementById('urlInput');
            const pasteBtn = document.getElementById('pasteBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const statusArea = document.getElementById('statusArea');
            const historyList = document.getElementById('historyList');
            const historyCount = document.getElementById('historyCount');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');

            let downloads = [];
            let isDownloading = false;

            function updateHistoryUI() {
                historyCount.textContent = downloads.length;

                if (downloads.length === 0) {
                    historyList.innerHTML = '<div class="empty-history">no downloads yet</div>';
                    return;
                }

                const reversed = [...downloads].reverse();
                const fragment = document.createDocumentFragment();

                reversed.forEach((item) => {
                    const div = document.createElement('div');
                    div.className = 'history-item';

                    let displayUrl = item.url;
                    if (displayUrl.length > 70) {
                        displayUrl = displayUrl.substring(0, 67) + '...';
                    }

                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    if (item.status === 'success') {
                        badge.textContent = '✓ done';
                        badge.style.background = '#1e4a2e';
                        badge.style.color = '#b0f0c0';
                        badge.style.borderColor = '#2d6b45';
                    } else if (item.status === 'failed') {
                        badge.textContent = '✗ failed';
                        badge.style.background = '#5a1e2a';
                        badge.style.color = '#ffb3b8';
                        badge.style.borderColor = '#8f3a4a';
                    } else {
                        badge.textContent = '⏳ pending';
                        badge.style.background = '#3b3a1e';
                        badge.style.color = '#f0e6b0';
                        badge.style.borderColor = '#7a7040';
                    }

                    const urlSpan = document.createElement('span');
                    urlSpan.className = 'hist-url';
                    urlSpan.textContent = displayUrl;
                    urlSpan.title = item.url;

                    const timeSpan = document.createElement('span');
                    timeSpan.style.fontSize = '0.65rem';
                    timeSpan.style.color = '#5c6f8c';
                    timeSpan.style.marginLeft = 'auto';
                    timeSpan.style.whiteSpace = 'nowrap';
                    const date = new Date(item.timestamp);
                    timeSpan.textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    div.appendChild(badge);
                    div.appendChild(urlSpan);
                    div.appendChild(timeSpan);
                    fragment.appendChild(div);
                });

                historyList.innerHTML = '';
                historyList.appendChild(fragment);
            }

            function setStatus(message, type = 'info') {
                let icon = '💡';
                if (type === 'success') icon = '✅';
                else if (type === 'error') icon = '❌';
                else if (type === 'progress') icon = '⏳';
                else if (type === 'warning') icon = '⚠️';

                statusArea.innerHTML = `<span class="status-icon">${icon}</span><span class="status-text" id="statusText">${message}</span>`;
            }

            function addDownloadRecord(url, status = 'pending') {
                downloads.push({ url, timestamp: Date.now(), status });
                updateHistoryUI();
            }

            function updateLatestDownloadStatus(url, newStatus) {
                for (let i = downloads.length - 1; i >= 0; i--) {
                    if (downloads[i].url === url) {
                        downloads[i].status = newStatus;
                        break;
                    }
                }
                updateHistoryUI();
            }

            function startDownload() {
                const rawUrl = urlInput.value.trim();

                if (!rawUrl) {
                    setStatus('Please enter a URL to download.', 'error');
                    urlInput.focus();
                    return;
                }

                if (!/^https?:\/\//i.test(rawUrl)) {
                    setStatus('URL must start with http:// or https://', 'error');
                    urlInput.focus();
                    return;
                }

                if (isDownloading) {
                    setStatus('A download is already in progress. Please wait.', 'warning');
                    return;
                }

                isDownloading = true;
                downloadBtn.disabled = true;
                pasteBtn.disabled = true;

                setStatus(`Starting download: <strong>${escapeHtml(rawUrl)}</strong>`, 'progress');
                addDownloadRecord(rawUrl, 'pending');

                fetch(rawUrl, {
                    method: 'GET',
                    mode: 'cors',
                    headers: { 'Accept': '*/*' }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} ${response.statusText}`);
                    }

                    const contentDisposition = response.headers.get('content-disposition');
                    let filename = 'download';

                    if (contentDisposition) {
                        const match = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                        if (match && match[1]) {
                            filename = match[1].replace(/['"]/g, '');
                        } else {
                            const urlParts = rawUrl.split('/');
                            const lastPart = urlParts[urlParts.length - 1];
                            if (lastPart && lastPart.includes('.')) filename = lastPart.split('?')[0];
                        }
                    } else {
                        const urlParts = rawUrl.split('/');
                        const lastPart = urlParts[urlParts.length - 1];
                        if (lastPart && lastPart.includes('.')) filename = lastPart.split('?')[0];
                        else filename = 'download_file';
                    }

                    return response.blob().then(blob => ({ blob, filename }));
                })
                .then(({ blob, filename }) => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = filename || 'download';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => window.URL.revokeObjectURL(blobUrl), 150);

                    setStatus(`✅ Downloaded: <strong>${escapeHtml(filename)}</strong> (${formatBytes(blob.size)})`, 'success');
                    updateLatestDownloadStatus(rawUrl, 'success');
                })
                .catch(error => {
                    console.error('download error:', error);
                    let errorMsg = error.message || 'unknown error';
                    if (errorMsg.includes('Failed to fetch') || errorMsg.includes('NetworkError')) {
                        errorMsg = 'network error or CORS restriction. Try a different URL.';
                    }
                    setStatus(`❌ Download failed: ${escapeHtml(errorMsg)}`, 'error');
                    updateLatestDownloadStatus(rawUrl, 'failed');
                })
                .finally(() => {
                    isDownloading = false;
                    downloadBtn.disabled = false;
                    pasteBtn.disabled = false;
                });
            }

            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            function formatBytes(bytes, decimals = 1) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const dm = decimals < 0 ? 0 : decimals;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
            }

            downloadBtn.addEventListener('click', startDownload);

            urlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    startDownload();
                }
            });

            pasteBtn.addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        urlInput.value = text.trim();
                        setStatus('📋 URL pasted from clipboard', 'info');
                        urlInput.focus();
                    } else {
                        setStatus('Clipboard is empty.', 'warning');
                    }
                } catch (err) {
                    setStatus('⚠️ Unable to read clipboard. Use Ctrl+V manually.', 'warning');
                }
            });

            clearHistoryBtn.addEventListener('click', () => {
                if (downloads.length === 0) return;
                downloads = [];
                updateHistoryUI();
                setStatus('History cleared.', 'info');
            });

            updateHistoryUI();
            setStatus('Ready — enter a URL and click download.', 'info');
        })();
    </script>
</body>
</html>
